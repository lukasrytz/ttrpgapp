name: Release APK

# Tag a commit to cut a release:
#   git tag v1.2.3 && git push origin v1.2.3
# Builds a signed release APK and attaches it to a GitHub Release.
#
# Requires these repository secrets (Settings → Secrets → Actions):
#   RELEASE_KEYSTORE_BASE64   base64 of your release .keystore / .jks
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
# Without them the build fails fast rather than shipping an unsigned APK.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          RAW="${{ github.event.inputs.version }}"
          if [ -z "$RAW" ]; then RAW="${GITHUB_REF_NAME#v}"; fi
          if ! echo "$RAW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$RAW' must be MAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR=$(echo "$RAW" | cut -d. -f1)
          MINOR=$(echo "$RAW" | cut -d. -f2)
          PATCH=$(echo "$RAW" | cut -d. -f3)
          # Monotonic and deterministic from the tag; Play requires ever-increasing.
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$RAW" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # Derived, not GITHUB_REF_NAME: on workflow_dispatch that's a branch.
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"
          echo "Building $RAW (versionCode $CODE)"

      - name: Check signing secrets are present
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set — refusing to build an unsigned release."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build -w client

      - name: Sync Capacitor Android project
        working-directory: client
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        working-directory: client/android
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verify the APK is actually signed
        run: |
          APK=client/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::$APK not found"; exit 1; }
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"
          mv "$APK" "ttrpg-companion-${{ steps.version.outputs.name }}.apk"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="ttrpg-companion-${{ steps.version.outputs.name }}.apk"
          # create makes the tag if it doesn't exist yet (workflow_dispatch);
          # upload --clobber covers re-running a release that already exists.
          gh release create "$TAG" "$APK" --title "$TAG" --generate-notes \
            || gh release upload "$TAG" "$APK" --clobber
